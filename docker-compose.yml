version: "3.9"

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Replace with your actual Groq API key or use a .env file
      - GROQ_API_KEY=${GROQ_API_KEY:?Set GROQ_API_KEY in .env file}
      - FLASK_DEBUG=false
      - PORT=5000
    volumes:
      # Persist the data directory so scheduler writes survive restarts
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
